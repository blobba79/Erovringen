name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx bun test
      - run: npm run build
      - name: Provkör Linux-filen
        run: npx bun scripts/build/smoke.ts dist/erovringen-linux-x64
      - name: Ladda upp till releasen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          dist/erovringen-windows-x64.exe dist/erovringen-linux-x64 --clobber
      - name: Spara som artefakter
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: erovringen
          path: |
            dist/erovringen-windows-x64.exe
            dist/erovringen-linux-x64
